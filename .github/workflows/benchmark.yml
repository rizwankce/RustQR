name: Benchmark

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Profile to run when dataset_root is empty (`all-profiles` runs everything, `dual-kpi` runs boofcv-all + payload-validated)"
        required: false
        type: choice
        default: all-profiles
        options:
          - all-profiles
          - dual-kpi
          - boofcv-all
          - boofcv-blurred
          - boofcv-brightness
          - boofcv-bright-spots
          - boofcv-close
          - boofcv-curved
          - boofcv-damaged
          - boofcv-glare
          - boofcv-high-version
          - boofcv-lots
          - boofcv-monitor
          - boofcv-nominal
          - boofcv-noncompliant
          - boofcv-pathological
          - boofcv-perspective
          - boofcv-rotations
          - boofcv-shadows
          - payload-validated
      dataset_root:
        description: "Optional dataset root override path"
        required: false
        type: string
        default: ""
      limit:
        description: "Case limit (0 means all cases)"
        required: false
        type: string
        default: "0"
      max_working_dim:
        description: "Pipeline max working dimension"
        required: false
        type: string
        default: "1024"
      emergency_cutoff_ms:
        description: "Per-image emergency cutoff milliseconds"
        required: false
        type: string
        default: "1400"
      gate_global_rate_min:
        description: "KPI gate minimum global reading rate (applies to boofcv-all lane)"
        required: false
        type: string
        default: "0.4000"
      gate_rotations_rate_min:
        description: "KPI gate minimum rotations reading rate (applies to boofcv-all lane)"
        required: false
        type: string
        default: "0.4500"
      gate_high_version_rate_min:
        description: "KPI gate minimum high_version reading rate (applies to boofcv-all lane)"
        required: false
        type: string
        default: "0.0900"
      gate_median_runtime_ms_max:
        description: "KPI gate maximum median runtime in ms (set to 1000 to enforce target)"
        required: false
        type: string
        default: "1000"
      artifact_path:
        description: "Output artifact JSON path"
        required: false
        type: string
        default: benchmark/reading_rate.json

permissions:
  contents: read

jobs:
  reading_rate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run reading-rate benchmark
        id: run_benchmark
        shell: bash
        run: |
          set -euo pipefail

          profile_input="${{ github.event.inputs.profile }}"
          dataset_root_input="${{ github.event.inputs.dataset_root }}"
          artifact_path_input="${{ github.event.inputs.artifact_path }}"
          limit_input="${{ github.event.inputs.limit }}"
          max_working_dim_input="${{ github.event.inputs.max_working_dim }}"
          emergency_cutoff_ms_input="${{ github.event.inputs.emergency_cutoff_ms }}"
          gate_global_rate_min_input="${{ github.event.inputs.gate_global_rate_min }}"
          gate_rotations_rate_min_input="${{ github.event.inputs.gate_rotations_rate_min }}"
          gate_high_version_rate_min_input="${{ github.event.inputs.gate_high_version_rate_min }}"
          gate_median_runtime_ms_max_input="${{ github.event.inputs.gate_median_runtime_ms_max }}"

          # Emit upload path before running benchmarks so downstream upload can
          # still resolve an artifact location if this step exits early.
          if [[ -n "$dataset_root_input" ]]; then
            artifact_upload_path="$artifact_path_input"
          elif [[ "$profile_input" == "all-profiles" ]]; then
            artifact_upload_path="$artifact_path_input"
            if [[ "$artifact_upload_path" == *.json ]]; then
              artifact_upload_path="$(dirname "$artifact_upload_path")"
            fi
            if [[ -z "$artifact_upload_path" || "$artifact_upload_path" == "." ]]; then
              artifact_upload_path="benchmark/all_profiles"
            fi
          elif [[ "$profile_input" == "dual-kpi" ]]; then
            artifact_upload_path="$artifact_path_input"
            if [[ "$artifact_upload_path" == *.json ]]; then
              artifact_upload_path="$(dirname "$artifact_upload_path")"
            fi
            if [[ -z "$artifact_upload_path" || "$artifact_upload_path" == "." ]]; then
              artifact_upload_path="benchmark/dual_kpi"
            fi
          else
            artifact_upload_path="$artifact_path_input"
          fi
          echo "artifact_upload_path=$artifact_upload_path" >> "$GITHUB_OUTPUT"

          run_one() {
            local artifact_path="$1"
            local with_kpi_gate="$2"
            shift
            shift
            local args=(reading-rate --artifact "$artifact_path" "$@")
            if [[ "$limit_input" != "0" ]]; then
              args+=(--limit "$limit_input")
            fi
            args+=(--max-working-dim "$max_working_dim_input")
            args+=(--emergency-cutoff-ms "$emergency_cutoff_ms_input")
            if [[ "$with_kpi_gate" == "1" ]]; then
              args+=(--gate-global-rate-min "$gate_global_rate_min_input")
              args+=(--gate-rotations-rate-min "$gate_rotations_rate_min_input")
              args+=(--gate-high-version-rate-min "$gate_high_version_rate_min_input")
              args+=(--gate-median-runtime-ms-max "$gate_median_runtime_ms_max_input")
            fi

            mkdir -p "$(dirname "$artifact_path")"
            echo "Running: cargo run --locked --bin qrtool -- ${args[*]}"
            cargo run --locked --bin qrtool -- "${args[@]}"
          }

          if [[ -n "$dataset_root_input" ]]; then
            run_one "$artifact_path_input" "0" --dataset-root "$dataset_root_input"
          elif [[ "$profile_input" == "all-profiles" ]]; then
            artifact_dir="$artifact_upload_path"
            mkdir -p "$artifact_dir"

            profiles=(
              boofcv-all
              boofcv-blurred
              boofcv-brightness
              boofcv-bright-spots
              boofcv-close
              boofcv-curved
              boofcv-damaged
              boofcv-glare
              boofcv-high-version
              boofcv-lots
              boofcv-monitor
              boofcv-nominal
              boofcv-noncompliant
              boofcv-pathological
              boofcv-perspective
              boofcv-rotations
              boofcv-shadows
              payload-validated
            )

            for profile in "${profiles[@]}"; do
              if [[ "$profile" == "boofcv-all" ]]; then
                run_one "$artifact_dir/reading_rate_${profile}.json" "1" --profile "$profile"
              else
                run_one "$artifact_dir/reading_rate_${profile}.json" "0" --profile "$profile"
              fi
            done
          elif [[ "$profile_input" == "dual-kpi" ]]; then
            artifact_dir="$artifact_upload_path"
            mkdir -p "$artifact_dir"

            run_one "$artifact_dir/reading_rate_boofcv-all.json" "1" --profile "boofcv-all"
            run_one "$artifact_dir/reading_rate_payload-validated.json" "0" --profile "payload-validated"
          else
            if [[ "$profile_input" == "boofcv-all" ]]; then
              run_one "$artifact_path_input" "1" --profile "$profile_input"
            else
              run_one "$artifact_path_input" "0" --profile "$profile_input"
            fi
          fi

      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reading-rate-${{ github.run_id }}
          path: ${{ steps.run_benchmark.outputs.artifact_upload_path }}
          if-no-files-found: error
