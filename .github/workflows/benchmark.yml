name: Benchmark

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Smoke profile to run when dataset_root is empty"
        required: false
        type: choice
        default: monitor-smoke
        options:
          - monitor-smoke
          - nominal-smoke
          - payload-validated
      dataset_root:
        description: "Optional dataset root override path"
        required: false
        type: string
        default: ""
      limit:
        description: "Case limit (0 means all cases)"
        required: false
        type: string
        default: "0"
      max_working_dim:
        description: "Pipeline max working dimension"
        required: false
        type: string
        default: "1024"
      emergency_cutoff_ms:
        description: "Per-image emergency cutoff milliseconds"
        required: false
        type: string
        default: "1400"
      artifact_path:
        description: "Output artifact JSON path"
        required: false
        type: string
        default: benchmark/reading_rate.json

permissions:
  contents: read

jobs:
  reading_rate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run reading-rate benchmark
        shell: bash
        run: |
          set -euo pipefail

          artifact_path="${{ github.event.inputs.artifact_path }}"
          mkdir -p "$(dirname "$artifact_path")"

          args=(reading-rate --artifact "$artifact_path")
          if [[ -n "${{ github.event.inputs.dataset_root }}" ]]; then
            args+=(--dataset-root "${{ github.event.inputs.dataset_root }}")
          else
            args+=(--profile "${{ github.event.inputs.profile }}")
          fi

          if [[ "${{ github.event.inputs.limit }}" != "0" ]]; then
            args+=(--limit "${{ github.event.inputs.limit }}")
          fi

          args+=(--max-working-dim "${{ github.event.inputs.max_working_dim }}")
          args+=(--emergency-cutoff-ms "${{ github.event.inputs.emergency_cutoff_ms }}")

          echo "Running: cargo run --locked --bin qrtool -- ${args[*]}"
          cargo run --locked --bin qrtool -- "${args[@]}"

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: reading-rate-${{ github.run_id }}
          path: ${{ github.event.inputs.artifact_path }}
          if-no-files-found: error
