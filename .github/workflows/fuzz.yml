name: Fuzz

on:
  schedule:
    - cron: "23 4 * * 0"
  workflow_dispatch:
    inputs:
      max_total_time:
        description: "Seconds per fuzz target"
        required: false
        default: "120"

permissions:
  contents: read

jobs:
  sanitizer-fuzz:
    name: Sanitizer fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [public_image_input, matrix_decode]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Run bounded sanitizer campaign
        env:
          FUZZ_SECONDS: ${{ inputs.max_total_time || '120' }}
        run: cargo fuzz run --sanitizer address ${{ matrix.target }} -- -max_total_time=$FUZZ_SECONDS
      - name: Upload minimized failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
