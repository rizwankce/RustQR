[package]
name = "rust_qr"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Rizwan <rizwan@example.com>"]
description = "Experimental QR Code Model 2 detector and decoder in Rust"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rizwankce/RustQR"
keywords = ["qr", "qrcode", "barcode", "scanning", "vision"]
categories = ["computer-vision"]

[dependencies]
rayon = { version = "1.7", optional = true }
image = { version = "0.24", optional = true }
clap = { version = "4.5", features = ["derive"], optional = true }

[features]
default = ["parallel", "simd"]
# Multi-core scan and grayscale helpers.  The public helpers retain scalar
# fallbacks when this feature is disabled.
parallel = ["dep:rayon"]
# Enables the private x86_64/AArch64 grayscale kernels.  Scalar conversion is
# used on other architectures and whenever this feature is disabled.
simd = []
# File loading is deliberately kept out of the library's core byte-slice API.
image-loading = ["dep:image"]
tools = ["dep:clap", "image-loading"]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
image = "0.24"
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[[bench]]
name = "qr_detect"
harness = false

[[bench]]
name = "real_qr_images"
harness = false

[[bench]]
name = "grayscale"
harness = false

[[bench]]
name = "binarization"
harness = false

[[bench]]
name = "memory_pool"
harness = false

[[bench]]
name = "real_qr_cc"
harness = false

[[bench]]
name = "matrix_decode"
harness = false

[[bench]]
name = "wp014_profiles"
harness = false
required-features = ["tools"]

[[bin]]
name = "qrtool"
path = "src/bin/qrtool.rs"
required-features = ["tools"]
